[project]
name = "compute-csi-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "temporalio==1.9.0",
    "pydantic==2.10.3",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflows", "activities"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
