global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'compute-csi-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Kepler - only active when deployed in a supported environment
  # Uncomment and configure when Kepler is available:
  # - job_name: 'kepler'
  #   static_configs:
  #     - targets: ['kepler-exporter:9102']
  #   metrics_path: '/metrics'
