global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'compute-csi-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Add Kepler endpoints to kepler-targets.json. Prometheus reloads the file
  # automatically; targets must still be reachable from the Compose network.
  - job_name: 'kepler'
    file_sd_configs:
      - files:
          - '/etc/prometheus/kepler-targets.json'
        refresh_interval: 30s
